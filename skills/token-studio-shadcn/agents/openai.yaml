interface:
  display_name: "Token Studio · Design & Ship"
  short_description: "Interview, design direction, shadcn code and critical review"
  default_prompt: "Use $token-studio-shadcn to inspect context, resolve material intent and write SPEC.md. For new UI without a clear brand/reference, propose two concise directions and ask me to choose unless I delegate it. Self-review the direction, build the requested screen, then critique the actual browser render and recheck repairs. If I ask only for grill me or critique, deliver that artifact without unrequested implementation."
