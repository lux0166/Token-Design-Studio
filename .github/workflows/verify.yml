name: Verify packages
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:local
      - run: npm run test:package
        env:
          STUDIO_SKIP_CODEX_SETUP: '1'
      - run: npm run pack:skill
      - run: npm run test:skill-package
      - run: npm run pack:legacy
      - run: npm run test:package -- output/npm/token-design-studio-0.2.1.tgz
        env:
          STUDIO_SKIP_CODEX_SETUP: '1'
